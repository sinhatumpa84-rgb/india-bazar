openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ShopKart - Indian e-commerce API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog
  - name: categories
    description: Product categories
  - name: cart
    description: Shopping cart
  - name: wishlist
    description: Wishlist
  - name: orders
    description: Orders
  - name: addresses
    description: Delivery addresses
  - name: reviews
    description: Product reviews
  - name: user
    description: User profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with filters
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: brand
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: minRating
          in: query
          schema: { type: number }
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating, newest, popular]
        - name: page
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured/trending products
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/deals:
    get:
      operationId: getDealsOfTheDay
      tags: [products]
      summary: Get deals of the day (big discounts)
      responses:
        "200":
          description: Deals of the day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scraper/scrape:
    post:
      operationId: scrapeProducts
      tags: [products]
      summary: Trigger real-time web scraping
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeRequest"
      responses:
        "200":
          description: Scraped products result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"

  /cart/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove item from cart
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Removed

  /cart/clear:
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear entire cart
      responses:
        "204":
          description: Cleared

  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: Get wishlist
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"
    post:
      operationId: addToWishlist
      tags: [wishlist]
      summary: Add product to wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"

  /wishlist/{productId}:
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      summary: Remove from wishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Removed

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List user orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: placeOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: Cancel an order
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /addresses:
    get:
      operationId: listAddresses
      tags: [addresses]
      summary: List saved addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: createAddress
      tags: [addresses]
      summary: Add a new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /addresses/{id}:
    put:
      operationId: updateAddress
      tags: [addresses]
      summary: Update address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
    delete:
      operationId: deleteAddress
      tags: [addresses]
      summary: Delete address
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  /reviews/{productId}:
    get:
      operationId: getProductReviews
      tags: [reviews]
      summary: Get reviews for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /user/profile:
    get:
      operationId: getUserProfile
      tags: [user]
      summary: Get user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateUserProfile
      tags: [user]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [user]
      summary: Get cart count, wishlist count, active orders
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Product:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        description: { type: string }
        price: { type: number }
        mrp: { type: number }
        discount: { type: number }
        category: { type: string }
        subcategory: { type: ["string", "null"] }
        brand: { type: string }
        images: { type: array, items: { type: string } }
        rating: { type: number }
        reviewCount: { type: number }
        stock: { type: number }
        seller: { type: string }
        isFeatured: { type: boolean }
        manufacturerName: { type: ["string", "null"] }
        manufacturerAddress: { type: ["string", "null"] }
        countryOfOrigin: { type: ["string", "null"] }
        netQuantity: { type: ["string", "null"] }
        gstSlab: { type: ["number", "null"] }
        dimensions: { type: ["string", "null"] }
        barcode: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, name, description, price, mrp, discount, category, brand, images, rating, reviewCount, stock, seller, isFeatured, createdAt]

    ProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: number }
        page: { type: number }
        totalPages: { type: number }
      required: [products, total, page, totalPages]

    ScrapeRequest:
      type: object
      properties:
        category: { type: string }
        query: { type: string }
        limit: { type: number }

    ScrapeResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        count: { type: number }
        source: { type: string }
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required: [success, message, count, source, products]

    Category:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
        productCount: { type: number }
      required: [id, name, slug, icon, productCount]

    CartItem:
      type: object
      properties:
        id: { type: number }
        productId: { type: number }
        product:
          $ref: "#/components/schemas/Product"
        quantity: { type: number }
      required: [id, productId, product, quantity]

    CartItemInput:
      type: object
      properties:
        productId: { type: number }
        quantity: { type: number }
      required: [productId, quantity]

    CartItemUpdate:
      type: object
      properties:
        quantity: { type: number }
      required: [quantity]

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal: { type: number }
        discount: { type: number }
        deliveryCharge: { type: number }
        total: { type: number }
        itemCount: { type: number }
      required: [items, subtotal, discount, deliveryCharge, total, itemCount]

    WishlistItem:
      type: object
      properties:
        id: { type: number }
        productId: { type: number }
        product:
          $ref: "#/components/schemas/Product"
        addedAt: { type: string }
      required: [id, productId, product, addedAt]

    WishlistInput:
      type: object
      properties:
        productId: { type: number }
      required: [productId]

    OrderItem:
      type: object
      properties:
        id: { type: number }
        productId: { type: number }
        product:
          $ref: "#/components/schemas/Product"
        quantity: { type: number }
        price: { type: number }
      required: [id, productId, product, quantity, price]

    Order:
      type: object
      properties:
        id: { type: number }
        status:
          type: string
          enum: [pending, confirmed, shipped, out_for_delivery, delivered, cancelled]
        paymentMethod:
          type: string
          enum: [cod, upi, card, netbanking]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refunded]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        address:
          $ref: "#/components/schemas/Address"
        subtotal: { type: number }
        discount: { type: number }
        deliveryCharge: { type: number }
        total: { type: number }
        estimatedDelivery: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, status, paymentMethod, paymentStatus, items, address, subtotal, discount, deliveryCharge, total, createdAt, updatedAt]

    OrderInput:
      type: object
      properties:
        addressId: { type: number }
        paymentMethod:
          type: string
          enum: [cod, upi, card, netbanking]
        cartItemIds:
          type: array
          items: { type: number }
      required: [addressId, paymentMethod, cartItemIds]

    Address:
      type: object
      properties:
        id: { type: number }
        fullName: { type: string }
        phone: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        isDefault: { type: boolean }
        addressType:
          type: string
          enum: [home, work, other]
      required: [id, fullName, phone, addressLine1, city, state, pincode, isDefault, addressType]

    AddressInput:
      type: object
      properties:
        fullName: { type: string }
        phone: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        isDefault: { type: boolean }
        addressType:
          type: string
          enum: [home, work, other]
      required: [fullName, phone, addressLine1, city, state, pincode, isDefault, addressType]

    Review:
      type: object
      properties:
        id: { type: number }
        productId: { type: number }
        reviewerName: { type: string }
        rating: { type: number }
        title: { type: string }
        comment: { type: string }
        isVerifiedPurchase: { type: boolean }
        createdAt: { type: string }
      required: [id, productId, reviewerName, rating, title, comment, isVerifiedPurchase, createdAt]

    ReviewInput:
      type: object
      properties:
        rating: { type: number }
        title: { type: string }
        comment: { type: string }
      required: [rating, title, comment]

    UserProfile:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, name, email, createdAt]

    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: ["string", "null"] }

    DashboardSummary:
      type: object
      properties:
        cartItemCount: { type: number }
        wishlistCount: { type: number }
        activeOrderCount: { type: number }
        totalOrderCount: { type: number }
      required: [cartItemCount, wishlistCount, activeOrderCount, totalOrderCount]
